# Nombre de la aplicación
spring.application.name=biblioteca-backend

# Puerto del servidor
server.port=8080

# Lee las credenciales desde el archivo .env de la carpeta del backend (no se sube a git)
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL en Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Seguridad: clave para firmar los tokens JWT y cuánto duran
app.jwt.secret=${JWT_SECRET}
app.jwt.horas-validez=8

# Cuenta de administrador que se crea al arrancar si todavía no existe
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# JPA / Hibernate: crea y actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
