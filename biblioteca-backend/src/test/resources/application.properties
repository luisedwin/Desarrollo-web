# Las pruebas usan H2 en memoria para no depender de Supabase
spring.datasource.url=jdbc:h2:mem:biblioteca;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Seguridad (valores solo para pruebas)
app.jwt.secret=clave-de-pruebas-solo-para-tests-0123456789
app.admin.email=admin@test.com
app.admin.password=admin-pruebas-123
