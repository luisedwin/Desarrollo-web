<header class="barra-principal">
  <div class="barra-contenedor">
    <a routerLink="/libros" class="marca-logo">
      <div class="logo-icono">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
          <path d="M6 2v20"></path>
          <path d="M10 7h6"></path>
          <path d="M10 11h6"></path>
        </svg>
      </div>
      <div class="logo-texto">
        <span class="logo-titulo">ATHENAEUM</span>
        <span class="logo-sub">Biblioteca Virtual</span>
      </div>
    </a>

    @if (auth.sesion(); as sesion) {
      <nav class="nav-links">
        <a routerLink="/libros" routerLinkActive="activo" class="nav-item">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span>Catálogo</span>
        </a>
        <a routerLink="/ejemplares" routerLinkActive="activo" class="nav-item">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
          </svg>
          <span>Ejemplares</span>
        </a>
        @if (auth.esAdmin()) {
          <a routerLink="/socios" routerLinkActive="activo" class="nav-item">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Socios</span>
          </a>
          <a routerLink="/prestamos" routerLinkActive="activo" class="nav-item">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
            <span>Préstamos</span>
          </a>
        } @else {
          <a routerLink="/mis-prestamos" routerLinkActive="activo" class="nav-item">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
            <span>Mis préstamos</span>
          </a>
        }
      </nav>

      <div class="usuario-panel">
        <button
          type="button"
          class="btn-tema"
          (click)="theme.toggleTheme()"
          [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          aria-label="Cambiar tema"
        >
          @if (theme.isDark()) {
            <!-- Sun icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          } @else {
            <!-- Moon icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
          }
        </button>

        <div class="usuario-chip">
          <div class="usuario-avatar">
            {{ sesion.nombre.charAt(0).toUpperCase() }}
          </div>
          <div class="usuario-info">
            <span class="usuario-nombre">{{ sesion.nombre }}</span>
            <span class="usuario-rol" [class.rol-admin]="sesion.rol === 'ADMIN'">
              {{ sesion.rol === 'ADMIN' ? 'Administrador' : 'Lector' }}
            </span>
          </div>
        </div>

        <button type="button" class="btn-salir" (click)="auth.cerrarSesion()" title="Cerrar sesión">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" x2="9" y1="12" y2="12"></line>
          </svg>
          <span>Salir</span>
        </button>
      </div>
    } @else {
      <!-- Unauthenticated header actions -->
      <div class="usuario-panel">
        <button
          type="button"
          class="btn-tema"
          (click)="theme.toggleTheme()"
          [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          aria-label="Cambiar tema"
        >
          @if (theme.isDark()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
          }
        </button>
        <a routerLink="/login" class="btn btn-sm btn-primario">Iniciar Sesión</a>
      </div>
    }
  </div>
</header>

<main class="contenido-principal">
  <router-outlet />
</main>
