<div class="catalogo-wrapper anim-fade" style="max-width: 640px; margin: 24px auto;">
  <div class="catalogo-hero" style="border: none; text-align: center; justify-content: center; margin-bottom: 12px;">
    <div>
      <div class="hero-tag">MEMBRESÍA DE LECTOR</div>
      <h1>Crear Cuenta de Lector</h1>
      <p class="catalogo-sub">
        Regístrate para consultar el acervo bibliográfico y gestionar tus préstamos personales en Athenaeum.
      </p>
    </div>
  </div>

  @if (error()) {
    <div class="alerta-error">
      <span>{{ error() }}</span>
    </div>
  }

  <form class="tarjeta formulario anim-fade" [formGroup]="form" (ngSubmit)="crearCuenta()" style="max-width: none;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <label>
        Nombre *
        <input formControlName="nombre" autocomplete="given-name" placeholder="Tu nombre" [class.invalido]="invalido('nombre')" />
        @if (invalido('nombre')) {
          <small>El nombre es obligatorio.</small>
        }
      </label>

      <label>
        Apellido *
        <input formControlName="apellido" autocomplete="family-name" placeholder="Tu apellido" [class.invalido]="invalido('apellido')" />
        @if (invalido('apellido')) {
          <small>El apellido es obligatorio.</small>
        }
      </label>
    </div>

    <label>
      Documento de Identidad (DNI / Cédula) *
      <input formControlName="documento" placeholder="Número de documento de identidad" [class.invalido]="invalido('documento')" />
      @if (invalido('documento')) {
        <small>Ingresa un documento válido (6 a 20 caracteres).</small>
      }
    </label>

    <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;">
      <label>
        Correo Electrónico *
        <input type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com" [class.invalido]="invalido('email')" />
        @if (invalido('email')) {
          <small>Ingresa un correo electrónico válido.</small>
        }
      </label>

      <label>
        Teléfono de Contacto
        <input formControlName="telefono" autocomplete="tel" placeholder="+51 912345678" [class.invalido]="invalido('telefono')" />
        @if (invalido('telefono')) {
          <small>Solo caracteres numéricos y válidos.</small>
        }
      </label>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <label>
        Contraseña *
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Mínimo 8 caracteres"
          [class.invalido]="invalido('password')"
        />
        @if (invalido('password')) {
          <small>Mínimo 8 caracteres requeridos.</small>
        }
      </label>

      <label>
        Confirmar Contraseña *
        <input
          type="password"
          formControlName="confirmacion"
          autocomplete="new-password"
          placeholder="Repite tu contraseña"
          [class.invalido]="confirmacionInvalida()"
        />
        @if (confirmacionInvalida()) {
          <small>Las contraseñas no coinciden.</small>
        }
      </label>
    </div>

    <button type="submit" class="btn btn-primario" [disabled]="enviando()" style="padding: 13px; font-size: 1rem; margin-top: 10px;">
      {{ enviando() ? 'Creando membresía…' : 'Crear Cuenta de Lector' }}
    </button>

    <p style="text-align: center; margin-top: 12px; font-size: 0.9rem; color: var(--text-secondary);">
      ¿Ya estás registrado? <a routerLink="/login" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Inicia sesión aquí</a>
    </p>
  </form>
</div>
